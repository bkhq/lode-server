# Spike only — see README.md. Never deployed; `run.ts` boots it with
# `wrangler dev` against local R2 and Durable Object simulators.
name = "lode-registry-spike"
main = "worker.ts"
# Same runtime settings as apps/api/wrangler.toml.
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "SPIKE"
class_name = "SpikeDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpikeDurableObject"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lode-registry-spike"
