name = "lode-bk-io"
main = "src/workers/entry.ts"
compatibility_date = "2026-09-01"
# node:crypto / node:buffer / node:path / node:util are used across the shared
# codebase (PBKDF2 hashing, base64url encoding, path joins).
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL even when a custom domain is attached: adding a
# route otherwise turns it off, which leaves nothing to reach the deployment
# by while the domain is still being provisioned.
workers_dev = true

# `bun:sqlite` is imported statically by the encryption module's meta.db
# reader. That mode is rejected at boot here, so the import resolves to a stub
# that throws if anything ever reaches it.
[alias]
"bun:sqlite" = "./src/workers/stub-bun-sqlite.ts"

# One Durable Object class holds the SQLite database and runs the app.
[[durable_objects.bindings]]
name = "APP"
class_name = "AppDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppDurableObject"]

# Blob storage for the file module (FILE_STORAGE_DRIVER=r2).
[[r2_buckets]]
binding = "FILES"
bucket_name = "lode-server-files"

# Registry package assets.
[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "lode-server-packages"

# The SPA is served by the asset pipeline; only the API prefixes reach the
# Worker. Any other path is answered from the assets, with the SPA's index.html
# for anything unknown — so a prefix left out here never reaches the app.
# `/r/*` is the package read feed prefix and must reach the Worker instead of
# the SPA fallback. It stays at the origin root whatever BASE_PATH is.
#
# Under a BASE_PATH (say `/u`) the build's files still sit at the root of the
# directory while its HTML references `/u/assets/…`, which the pipeline cannot
# remap. Set the variables BASE_PATH (and HOME_PAGE, see .env.example),
# build the SPA with the same BASE_PATH, and replace the line below with
#   run_worker_first = ["/", "/u/*", "/r/*"]
# The Worker then serves the SPA's paths itself (src/workers/spa.ts) and
# forwards `/u/api/*` to the app. The deploy workflow does both from the
# BASE_PATH repository variable.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/r/*"]

[observability]
enabled = true

# Non-secret configuration. Secrets (SESSION_SECRET, OAUTH_CLIENT_SECRET,
# SINGLE_USER_PASSWORD_HASH, ...) go through `wrangler secret put` — never in
# this file.
[vars]
NODE_ENV = "production"
LOG_TO_STDOUT = "true"
# Durable Object storage is encrypted by the host; libsql page encryption has
# no counterpart here and is rejected at boot.
DB_ENCRYPTION = "false"
FILE_STORAGE_DRIVER = "r2"
# Presigning needs the R2 S3 API and a key pair, which a bucket binding does
# not carry; downloads stream through the Worker instead.
FILE_PRESIGN_ENABLED = "false"
REGISTRY_BLOB_DRIVER = "r2"
TRUST_PROXY = "false"
