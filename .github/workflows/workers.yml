name: workers

# Cloudflare Workers is the secondary runtime: the app also runs on a single
# Durable Object that owns its SQLite database (see docs/develop/runtime.md).
# This workflow proves that target still works.
#
#  - `smoke-local` always runs. It boots the Worker in workerd through
#    `wrangler dev`, so it needs no Cloudflare account.
#  - `deploy` is manual (workflow_dispatch only). It deploys to Cloudflare
#    and runs the same suite against the live URL. A push never publishes.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/workers/**"
      - ".github/workflows/workers.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/workers/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Discard all deployed data first: the Worker, its Durable Object database, and every file in the R2 bucket"
        type: boolean
        default: false

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24.21.0"

jobs:
  smoke-local:
    name: workerd smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The migrations bundle is committed; a stale one would make the
      # Worker run a different schema than the Bun build.
      - name: Check the Durable Object migrations bundle is current
        working-directory: apps/api
        run: bun run db:check-migrations

      # `wrangler.jsonc` points the asset pipeline at apps/web/dist.
      - name: Build the SPA
        run: bun run --filter @app/web build

      - name: Build the Worker bundle
        working-directory: apps/api
        run: bun run workers:build

      - name: Configure smoke-test variables
        run: cp apps/api/.dev.vars.example apps/api/.dev.vars

      - name: Smoke test on workerd
        run: bun run test:workers

  deploy:
    name: deploy to cloudflare
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: smoke-local
    # Manual only. A push must never publish: this repository is a template,
    # and the Worker it deploys is a live, publicly reachable app.
    if: github.event_name == 'workflow_dispatch'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional. When set, the Worker is bound to this hostname and the app
      # is told its own origin, which the OAuth callback and the CSRF guard
      # both need. Unset means workers.dev only.
      CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
      # The zone the hostname belongs to. Stated rather than inferred:
      # wrangler cannot always work it out from the hostname, and a public
      # suffix with two labels would defeat any guess.
      CUSTOM_DOMAIN_ZONE: ${{ vars.WORKER_CUSTOM_DOMAIN_ZONE }}
      # When an issuer is configured the deployment logs in through OpenID
      # Connect. The SPA offers one method or the other, so single-user is
      # left off in that case and the suite checks the provider wiring
      # instead of signing in.
      OAUTH_ISSUER: ${{ vars.OAUTH_ISSUER }}
      OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      DEFAULT_ADMIN: ${{ vars.DEFAULT_ADMIN }}
      # Optional: sync group memberships from an IdP claim at login.
      OAUTH_SCOPES: ${{ vars.OAUTH_SCOPES }}
      OAUTH_GROUPS_CLAIM: ${{ vars.OAUTH_GROUPS_CLAIM }}
    steps:
      # The `secrets` context cannot be read from a job-level `if`, so the
      # credential check is a step. Without it the job would fail deep inside
      # wrangler with a less obvious message.
      - name: Require Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be available to this repository"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the SPA
        run: bun run --filter @app/web build

      # The bucket named in wrangler.toml has to exist before the binding
      # resolves. Creating it twice is not an error worth failing on.
      - name: Ensure the R2 bucket exists
        working-directory: apps/api
        run: |
          bucket="$(grep -oP 'bucket_name = "\K[^"]+' wrangler.toml)"
          bunx wrangler r2 bucket create "$bucket" 2>&1 | tee /tmp/bucket.log ||             grep -qiE "already (exists|owned)" /tmp/bucket.log

      # Attaching a custom domain fails late, after the code has been
      # uploaded, and leaves the Worker's triggers half-updated. Checking the
      # zone first turns that into an early failure that names the zones the
      # credentials can actually see.
      - name: Check the custom domain's zone is reachable
        if: env.CUSTOM_DOMAIN != ''
        run: |
          set -euo pipefail
          zone="${CUSTOM_DOMAIN_ZONE:-}"
          if [ -z "$zone" ]; then
            echo "::error::WORKER_CUSTOM_DOMAIN is set but WORKER_CUSTOM_DOMAIN_ZONE is not"
            exit 1
          fi
          zones="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50")"
          if echo "$zones" | jq -e --arg z "$zone" '.result[]? | select(.name == $z)' >/dev/null; then
            echo "zone $zone is on this account"
            exit 0
          fi
          echo "::error::the zone '$zone' is not on the account these credentials belong to"
          echo "zones this token can see:"
          echo "$zones" | jq -r '.result[]?.name // empty' | sed 's/^/  - /'
          echo "$zones" | jq -r '.errors[]?.message // empty' | sed 's/^/  api: /'
          exit 1

      # A Durable Object keeps running the code and configuration it was
      # constructed with until it is evicted, and this app's alarms keep it
      # resident. An object created before the reset mechanism existed
      # therefore cannot notice a new deploy at all — it has no fingerprint to
      # compare. Deleting the Worker removes the object and its storage, which
      # is the only way past that one-time state. Objects created from here on
      # reset themselves.
      - name: Delete the existing Worker
        if: inputs.fresh
        working-directory: apps/api
        run: bunx wrangler delete --force || true

      # Deleting a Worker takes its Durable Object storage but not its R2
      # bucket. With the database gone, every stored file is an orphan the
      # app can no longer reach or garbage-collect, so a fresh start empties
      # the bucket too. Wrangler can delete an object but not list them, so
      # the listing comes from the API.
      - name: Empty the R2 bucket
        if: inputs.fresh
        working-directory: apps/api
        run: |
          set -euo pipefail
          bucket="$(grep -oP 'bucket_name = "\K[^"]+' wrangler.toml)"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$bucket/objects"
          deleted=0
          cursor=""
          while :; do
            page="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=1000${cursor:+&cursor=$cursor}")"
            if [ "$(echo "$page" | jq -r '.success')" != "true" ]; then
              echo "$page" | jq -r '.errors[]?.message // empty' | sed 's/^/api: /'
              # A bucket that does not exist yet has nothing to empty.
              echo "$page" | jq -e '.errors[]? | select(.code == 10006)' >/dev/null && break
              exit 1
            fi
            while IFS= read -r key; do
              [ -z "$key" ] && continue
              # This app only writes `<ab>/<cd>/<sha256>` keys. The quoted
              # expansion below is not re-parsed by the shell, but a
              # destructive loop should still refuse anything outside a plain
              # character set — a key holding a newline would otherwise be
              # split by `read` and delete the wrong objects. The key itself
              # is not echoed: it could carry workflow-command syntax.
              case "$key" in
                *[!A-Za-z0-9._/-]*)
                  echo "::error::refusing to delete an object whose key has unexpected characters; remove it by hand"
                  exit 1
                  ;;
              esac
              bunx wrangler r2 object delete "$bucket/$key" --remote >/dev/null
              deleted=$((deleted + 1))
            done < <(echo "$page" | jq -r '.result[]?.key')
            cursor="$(echo "$page" | jq -r '.result_info.cursor // empty')"
            [ -z "$cursor" ] && break
          done
          echo "removed $deleted objects from $bucket"

      # A secret shadows a `var` of the same name, so credentials left behind
      # by an earlier run would silently outrank the ones this run deploys.
      # `secret bulk` deletes a key when its value is null.
      - name: Clear any credential secrets from earlier runs
        working-directory: apps/api
        run: |
          echo '{"SINGLE_USER_MODE":null,"SINGLE_USER_USERNAME":null,"SINGLE_USER_PASSWORD_HASH":null}' \
            | bunx wrangler secret bulk 2>&1 | tee /tmp/clear.log || true
          echo "secrets remaining:"
          bunx wrangler secret list || true

      # Credentials are minted before the deploy and travel as `vars`, not as
      # secrets. `wrangler secret` publishes a version of its own, which turns
      # "deploy, then set secrets" into two versions and a question of which
      # one serves; a var is part of the same deploy and there is nothing to
      # sequence. The value here is a password hash, and the password behind
      # it is random per run and never printed.
      - name: Mint smoke-test credentials
        id: creds
        working-directory: apps/api
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          username="smoke-${{ github.run_id }}"
          # Written to a file rather than captured from stdout: anything the
          # runtime decides to print would otherwise be appended to the hash,
          # and a hash with trailing junk still passes the format check at
          # boot while failing every login.
          SMOKE_PW="$password" bun -e '
            const mod = await import("./src/modules/account/auth/password.ts");
            const pw = process.env.SMOKE_PW;
            if (!pw) {
              console.error("SMOKE_PW was empty");
              process.exit(1);
            }
            // Cloudflare refuses PBKDF2 above its ceiling, and a hash minted
            // above it cannot be verified there at all. The app exposes the
            // ceiling as a capability; the Workers value is what applies to
            // the deployment this hash is for.
            const hashed = await mod.hashPassword(pw, 100_000);
            if (!(await mod.verifyPassword(pw, hashed))) {
              console.error("generated hash does not verify against its own password");
              process.exit(1);
            }
            await Bun.write("/tmp/smoke-hash.txt", hashed);
          '
          hash="$(cat /tmp/smoke-hash.txt)"
          rm -f /tmp/smoke-hash.txt
          # Structure only — lengths and field count carry no secret material.
          echo "hash length ${#hash}, fields $(echo "$hash" | awk -F'$' '{print NF}')"

          # `[vars]` is the last table in the file, so appending extends it.
          {
            if [ -z "${OAUTH_ISSUER:-}" ]; then
              echo "SINGLE_USER_MODE = \"true\""
              echo "SINGLE_USER_USERNAME = \"$username\""
              echo "SINGLE_USER_PASSWORD_HASH = \"$hash\""
            else
              # The SPA renders a local form or an OAuth button, never both,
              # and single-user wins — so enabling it here would hide the
              # provider this deployment exists to use.
              echo "OAUTH_ISSUER = \"$OAUTH_ISSUER\""
              echo "OAUTH_CLIENT_ID = \"$OAUTH_CLIENT_ID\""
              echo "OAUTH_PKCE = \"true\""
              echo "DEFAULT_ADMIN = \"$DEFAULT_ADMIN\""
              if [ -n "${OAUTH_SCOPES:-}" ]; then
                echo "OAUTH_SCOPES = \"$OAUTH_SCOPES\""
              fi
              if [ -n "${OAUTH_GROUPS_CLAIM:-}" ]; then
                echo "OAUTH_GROUPS_CLAIM = \"$OAUTH_GROUPS_CLAIM\""
              fi
            fi
            # Low enough for the suite to reach in a short burst. The shipped
            # default is 60 a minute, which would take more requests to prove
            # than the property is worth.
            echo "CREATE_RATE_LIMIT_PER_MINUTE = \"10\""
            if [ -n "${CUSTOM_DOMAIN:-}" ]; then
              # In production the app refuses to guess its own origin from
              # forwarded headers, and the CSRF guard has nothing to compare
              # against until one of these is set.
              echo "APP_URL = \"https://$CUSTOM_DOMAIN\""
              echo "CORS_ORIGIN = \"https://$CUSTOM_DOMAIN\""
            fi
          } >> wrangler.toml

          # Last: a top-level array-of-tables closes the [vars] table, so
          # anything appended after this would land in the route, not in vars.
          if [ -n "${CUSTOM_DOMAIN:-}" ]; then
            {
              echo ""
              echo "[[routes]]"
              echo "pattern = \"$CUSTOM_DOMAIN\""
              echo "custom_domain = true"
              if [ -n "${CUSTOM_DOMAIN_ZONE:-}" ]; then
                echo "zone_name = \"$CUSTOM_DOMAIN_ZONE\""
              fi
            } >> wrangler.toml
          fi

          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"

      # Closes the loop between what is about to be deployed and what the
      # suite will send. If these disagree the fault is in this job; if they
      # agree and the deployment still refuses, it is not.
      - name: Check the deployed hash against the password the suite will use
        if: env.OAUTH_ISSUER == ''
        working-directory: apps/api
        env:
          SMOKE_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          hash="$(grep -oP 'SINGLE_USER_PASSWORD_HASH = "\K[^"]+' wrangler.toml)"
          echo "hash from wrangler.toml: length ${#hash}"
          SMOKE_HASH="$hash" bun -e '
            const mod = await import("./src/modules/account/auth/password.ts");
            const ok = await mod.verifyPassword(process.env.SMOKE_PASSWORD, process.env.SMOKE_HASH);
            console.log("deployed hash verifies the suite password:", ok);
            if (!ok) {
              process.exit(1);
            }
          '

      - name: Deploy
        id: deploy
        working-directory: apps/api
        run: |
          set -euo pipefail
          bunx wrangler deploy 2>&1 | tee /tmp/deploy.log
          if [ -n "${CUSTOM_DOMAIN:-}" ]; then
            # The suite must target the same origin the app was told it has,
            # or the CSRF guard rejects every mutating request.
            url="https://$CUSTOM_DOMAIN"
          else
            url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' /tmp/deploy.log | head -1)"
          fi
          if [ -z "$url" ]; then
            echo "::error::could not parse the deployed URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # The last unexamined link: what the deployment actually holds. Wrangler
      # reports what it sent, not what is bound, so this asks the API and
      # compares. Only the comparison and the lengths are printed.
      - name: Compare the bound configuration with what was deployed
        if: env.OAUTH_ISSUER == ''
        working-directory: apps/api
        run: |
          local_hash="$(grep -oP 'SINGLE_USER_PASSWORD_HASH = "\K[^"]+' wrangler.toml)"
          local_user="$(grep -oP 'SINGLE_USER_USERNAME = "\K[^"]+' wrangler.toml)"
          resp="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/bun-tpl-api/settings")"
          echo "$resp" | jq -r '.result.bindings[]? | select(.name | startswith("SINGLE_USER")) | "\(.name) type=\(.type) len=\((.text // "") | length)"'
          bound_hash="$(echo "$resp" | jq -r '.result.bindings[]? | select(.name=="SINGLE_USER_PASSWORD_HASH") | .text // ""')"
          bound_user="$(echo "$resp" | jq -r '.result.bindings[]? | select(.name=="SINGLE_USER_USERNAME") | .text // ""')"
          [ "$bound_hash" = "$local_hash" ] && echo "hash: MATCH" || echo "hash: MISMATCH (bound ${#bound_hash}, local ${#local_hash})"
          [ "$bound_user" = "$local_user" ] && echo "username: MATCH" || echo "username: MISMATCH (bound '$bound_user', local '$local_user')"

      # The edge takes a moment to serve the new version, and the object has
      # to notice its configuration changed and reset. The gate is the
      # precondition the suite needs: these credentials log in.
      - name: Wait for the new credentials to serve
        if: env.OAUTH_ISSUER == ''
        env:
          SMOKE_USERNAME: ${{ steps.creds.outputs.username }}
          SMOKE_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "user $SMOKE_USERNAME, password length ${#SMOKE_PASSWORD}"
          last=""
          # Ten attempts: the single-user lockout trips at ten failures, so
          # hammering past that only turns a diagnosable 401 into an opaque
          # 429. Each status is logged.
          for _ in $(seq 1 10); do
            last="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -H 'X-Requested-With: XMLHttpRequest' \
              -H "Origin: $url" \
              --data "$(jq -n --arg u "$SMOKE_USERNAME" --arg p "$SMOKE_PASSWORD" '{username:$u,password:$p}')" \
              "$url/api/account/auth/login-local" || true)"
            echo "login -> $last"
            [ "$last" = "200" ] && exit 0
            sleep 4
          done
          echo "::error::the minted credentials never logged in (last status $last)"
          exit 1

      # An OIDC deployment has no local password, so the suite proves the
      # provider wiring instead of signing in. The authenticated paths stay
      # covered by the workerd run above.
      # A custom domain routes as soon as its DNS record exists, but its
      # certificate is issued separately and a first attachment can take
      # minutes. Until it lands, HTTPS fails at the handshake while HTTP
      # already answers — worth telling apart, because one is a wait and the
      # other is a misconfiguration.
      - name: Wait for the deployment to serve
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for _ in $(seq 1 90); do
            # `|| true`: under `bash -e` a transport failure — the hostname not
            # resolving yet, a handshake before the certificate exists — would
            # otherwise abort the step on the first attempt instead of
            # retrying. curl still prints 000 for it.
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health" || true)"
            [ "$code" = "200" ] && { echo "serving"; exit 0; }
            sleep 8
          done
          plain="$(curl -s -o /dev/null -w '%{http_code}' "${url/https:/http:}/api/health" || true)"
          if [ "$plain" = "200" ]; then
            echo "::error::$url routes correctly but its TLS certificate is not issued yet; re-run once it is"
          else
            echo "::error::the deployment never answered /api/health (plain HTTP returned $plain)"
          fi
          exit 1

      - name: Smoke test the deployment
        env:
          SMOKE_USERNAME: ${{ steps.creds.outputs.username }}
          SMOKE_PASSWORD: ${{ steps.creds.outputs.password }}
          SMOKE_OAUTH_ISSUER: ${{ vars.OAUTH_ISSUER }}
          SMOKE_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
        run: |
          if [ -n "${SMOKE_OAUTH_ISSUER:-}" ]; then
            bun tests/workers/smoke.ts --url "${{ steps.deploy.outputs.url }}" --oidc
          else
            bun tests/workers/smoke.ts --url "${{ steps.deploy.outputs.url }}"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloudflare deployment"
            echo
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Durable Object: \`AppDurableObject\` (SQLite)"
            echo "- Storage: R2"
          } >> "$GITHUB_STEP_SUMMARY"
